[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-mcp"
version = "0.1.2"
description = "MCP tooling for game-engine work: a Spine 2D MCP server and a Godot MCP endpoint connector."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kurtlon Earl Sta. Ines" }]
dependencies = ["mcp>=1.2,<2", "pillow>=10"]
keywords = ["mcp", "model-context-protocol", "spine", "spine2d", "godot", "ai-agents", "game-dev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/kurtstaines/engine-mcp"
Issues = "https://github.com/kurtstaines/engine-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
engine-mcp-spine = "engine_mcp.spine_server:main"
engine-mcp-godot = "engine_mcp.godot_connect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
